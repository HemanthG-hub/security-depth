name: Security detection corpus

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/security-corpus.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/security-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install fastapi motor python-dotenv pydantic httpx pytest pytest-xdist pytest-asyncio
      - name: Run labeled detection corpus
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: security_corpus
        run: python -m pytest -n 0 -s -q tests